<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071426" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)" />
    </linearGradient>

    <linearGradient id="scan-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0)" />
      <stop offset="50%" stop-color="rgba(59, 130, 246, 0.8)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #60a5fa; }
    .stat-val { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
    .stat-lbl { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #64748b; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(320px); opacity: 0.2; }
    }

    .pulse-glow { animation: pulse 4s infinite ease-in-out; }
    .scanning-beam { animation: scan 3s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Decorative Glow Orbs -->
  <circle cx="150" cy="100" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)" class="pulse-glow" />
  <circle cx="1050" cy="300" r="200" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" class="pulse-glow" />

  <!-- Animated Scanning Beam -->
  <rect x="50" y="40" width="1100" height="4" fill="url(#scan-line)" class="scanning-beam" />

  <!-- Content Group -->
  <!-- Top Tag -->
  <g transform="translate(80, 75)">
    <rect width="250" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="35" y="21" class="badge-text">SANCTIONS &amp; AML PLATFORMS</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="155" class="title">Awesome Sanctions Screening Platform</text>

  <!-- Subtitle -->
  <text x="80" y="195" class="subtitle">Curated SaaS &amp; Open-Source Ecosystem for Watchlist Screening, PEPs &amp; Entity Resolution</text>

  <!-- Accent Line -->
  <rect x="80" y="225" width="600" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Metric Cards -->
  <g transform="translate(80, 260)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="80" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="20" y="36" class="stat-val">24 Enterprise</text>
    <text x="20" y="58" class="stat-lbl">SaaS &amp; Hosted Platforms</text>
    
    <!-- Card 2 -->
    <rect x="240" y="0" width="220" height="80" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="260" y="36" class="stat-val">60+ Repos</text>
    <text x="260" y="58" class="stat-lbl">Open-Source Engines &amp; Data</text>

    <!-- Card 3 -->
    <rect x="480" y="0" width="240" height="80" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="500" y="36" class="stat-val">Real-Time &amp; Batch</text>
    <text x="500" y="58" class="stat-lbl">OFAC, UN, EU, UK &amp; PEP Screening</text>
  </g>

  <!-- Shield/Security Graphic on Right -->
  <g transform="translate(940, 110)">
    <polygon points="100,0 190,40 190,140 100,210 10,140 10,40" fill="rgba(30, 41, 59, 0.6)" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)" />
    <!-- Checkmark & Radar -->
    <circle cx="100" cy="95" r="45" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" />
    <path d="M75,95 L92,112 L130,74" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
